<template id="scene_5-template">
  <div id="root" class="scene_5-root" data-composition-id="scene_5" data-width="1920" data-height="1080" data-duration="8.555" style="position:relative; width:1920px; height:1080px; overflow:hidden;">
    <style>
      #root {
        background: var(--canvas);
        font-family: var(--font-body);
      }
      #root *,
      #root *::before,
      #root *::after {
        box-sizing: border-box;
      }

      /* Ambient mesh background */
      .s5-mesh {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .s5-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.18;
      }
      .s5-blob-1 {
        width: 600px;
        height: 600px;
        background: var(--brand-primary);
        top: -120px;
        left: -80px;
      }
      .s5-blob-2 {
        width: 500px;
        height: 500px;
        background: var(--brand-secondary);
        bottom: -100px;
        right: 80px;
      }

      /* World (viewport-change wrapper) */
      .s5-world {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        transform-origin: 50% 50%;
        will-change: transform;
        z-index: 1;
      }

      /* Centered content column */
      .s5-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        text-align: center;
      }

      /* Shield icon wrapper */
      .s5-icon-wrap {
        display: block;
        width: 120px;
        height: 120px;
        margin-bottom: 32px;
        will-change: transform;
      }

      .s5-shield-svg {
        width: 120px;
        height: 120px;
      }

      /* Soft card */
      .s5-card {
        background: var(--surface-card);
        border-radius: var(--radius-card-lg);
        padding: 56px 72px 56px 72px;
        max-width: 760px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }

      /* Headline */
      .s5-headline {
        font-family: var(--font-display);
        font-size: 72px;
        font-weight: 500;
        line-height: 1.1;
        color: var(--ink);
        text-align: center;
        margin: 0 0 28px 0;
      }
      .s5-headline em {
        font-style: italic;
        color: var(--brand-primary);
      }

      /* Body lines */
      .s5-body-1,
      .s5-body-2 {
        font-family: var(--font-body);
        font-size: 26px;
        font-weight: 400;
        line-height: 1.5;
        color: var(--ink);
        text-align: center;
        max-width: 560px;
        margin: 0;
        opacity: 0;
      }
      .s5-body-1 {
        margin-bottom: 12px;
      }
    </style>

    <!-- Ambient mesh (decorative, full-bleed) -->
    <div class="s5-mesh">
      <div class="s5-blob s5-blob-1"></div>
      <div class="s5-blob s5-blob-2"></div>
    </div>

    <!-- Viewport-change world wrapper -->
    <div class="s5-world" id="s5-world">
      <div class="s5-content">

        <!-- Shield SVG icon (svg-icon-enrichment: pulse) -->
        <div class="s5-icon-wrap" id="s5-icon-wrap" style="opacity:0;">
          <svg class="s5-shield-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <!-- Shield outer path -->
            <path
              id="s5-shield-outer"
              d="M60 8 L100 24 L100 60 C100 82 80 100 60 112 C40 100 20 82 20 60 L20 24 Z"
              fill="none"
              stroke="var(--brand-primary)"
              stroke-width="3.5"
              stroke-linejoin="round"
            />
            <!-- Shield inner fill (pulses) -->
            <path
              id="s5-shield-fill"
              d="M60 18 L92 31 L92 60 C92 78 76 94 60 104 C44 94 28 78 28 60 L28 31 Z"
              fill="var(--brand-primary)"
              opacity="0.15"
            />
            <!-- Center dot accent (pulse ring) -->
            <circle id="s5-shield-dot" cx="60" cy="60" r="10" fill="var(--brand-primary)" opacity="0.7" />
            <circle id="s5-shield-ring" cx="60" cy="60" r="18" fill="none" stroke="var(--brand-primary)" stroke-width="2" opacity="0.4" />
          </svg>
        </div>

        <!-- Soft card: headline + body lines -->
        <div class="s5-card">
          <p class="s5-headline" id="s5-headline" style="opacity:0;">Bouclier <em>invisible</em></p>
          <p class="s5-body-1" id="s5-body-1">Un lait protecteur qui enveloppe chaque boucle.</p>
          <p class="s5-body-2" id="s5-body-2">Formule végane, douce et respectueuse du cheveu.</p>
        </div>

      </div>
    </div>

    <script>
      const EASE = {
        entry: "power2.out",
        emphasis: "power2.inOut",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 1.0,
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ── discrete-text-sequence: headline assembles, then two body lines stagger in ──
      // Beat 1: icon + headline fade in together at 0.2s
      tl.to("#s5-icon-wrap", { opacity: 1, y: 0, duration: DUR.slow, ease: EASE.entry }, 0.2);
      tl.fromTo(
        "#s5-headline",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: DUR.slow, ease: EASE.entry },
        0.5
      );

      // Beat 2: first body line ~1.8s
      tl.to("#s5-body-1", { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry }, 1.8);

      // Beat 3: second body line ~2.8s
      tl.to("#s5-body-2", { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry }, 2.8);

      // ── svg-icon-enrichment: shield interior pulses softly (continuous from 0.2s) ──
      // Pulse driver: dot + ring pulse with sin, offset by π/2
      const TOTAL_DUR = 8.555;
      const PULSE_START = 0.2;
      const PULSE_DUR = TOTAL_DUR - PULSE_START;
      const PULSE_CYCLES = 4; // ~2.1s per cycle
      const pulseState = { p: 0 };
      tl.to(
        pulseState,
        {
          p: Math.PI * 2 * PULSE_CYCLES,
          duration: PULSE_DUR,
          ease: "none",
          onUpdate: () => {
            const dotScale = 1 + Math.sin(pulseState.p) * 0.12;
            const ringScale = 1 + Math.sin(pulseState.p + Math.PI / 2) * 0.09;
            const ringOpacity = 0.4 + Math.sin(pulseState.p) * 0.25;
            const fillOpacity = 0.15 + Math.sin(pulseState.p + Math.PI / 4) * 0.08;
            const dot = document.getElementById("s5-shield-dot");
            const ring = document.getElementById("s5-shield-ring");
            const fill = document.getElementById("s5-shield-fill");
            if (dot) dot.setAttribute("transform", `translate(60 60) scale(${dotScale}) translate(-60 -60)`);
            if (ring) ring.setAttribute("transform", `translate(60 60) scale(${ringScale}) translate(-60 -60)`);
            if (ring) ring.style.opacity = String(Math.max(0, Math.min(1, ringOpacity)));
            if (fill) fill.style.opacity = String(Math.max(0, Math.min(0.35, fillOpacity)));
          },
        },
        PULSE_START
      );

      // ── sine-wave-loop: icon gently bobs (sole secondary live element after content lands) ──
      const IDLE_START = 3.4;
      const IDLE_DUR = TOTAL_DUR - IDLE_START;
      const IDLE_CYCLES = Math.floor(IDLE_DUR / 2.5); // ~2 cycles
      const idlePhase = { p: 0 };
      tl.to(
        idlePhase,
        {
          p: Math.PI * 2 * IDLE_CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: () => {
            const t = idlePhase.p / (Math.PI * 2 * IDLE_CYCLES);
            const FADE_FRAC = 0.2;
            const env = t < 1 - FADE_FRAC ? 1 : (1 - t) / FADE_FRAC;
            const y = Math.sin(idlePhase.p) * 3 * env;
            const s = 1 + Math.sin(idlePhase.p) * 0.010 * env;
            const iconEl = document.getElementById("s5-icon-wrap");
            if (iconEl) iconEl.style.transform = `translateY(${y}px) scale(${s})`;
          },
        },
        IDLE_START
      );

      // ── viewport-change: gentle upward drift throughout ──
      // Camera pans up → world translates down (world.y increases = content drifts up on screen)
      // Single-wrapper form: T = -offset * S. Drift is very subtle (S ~1.03, offset ~18px)
      const world = document.getElementById("s5-world");
      const cam = { scale: 1, x: 0, y: 0 };
      function applyCamera() {
        if (world) world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      }
      applyCamera();

      // Gentle upward drift: over 8.555s scale nudges to 1.03, camera drifts up ~18px world-units
      // T = -offset * S → cam.y = -18 * 1.03 ≈ -18.5 (content moves up)
      tl.to(
        cam,
        {
          scale: 1.03,
          y: -18,
          duration: TOTAL_DUR,
          ease: EASE.drift,
          onUpdate: applyCamera,
        },
        0
      );

      window.__timelines["scene_5"] = tl;
    </script>
  </div>
</template>
