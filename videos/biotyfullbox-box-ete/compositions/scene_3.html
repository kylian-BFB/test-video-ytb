<template id="scene_3-template">
  <div id="root" class="scene_3-root" data-composition-id="scene_3" data-width="1920" data-height="1080" data-duration="10.731" style="position:relative; width:1920px; height:1080px; overflow:hidden;">
    <style>
      #root {
        background: var(--canvas);
        font-family: var(--font-body);
      }
      #root *,
      #root *::before,
      #root *::after {
        box-sizing: border-box;
      }

      /* Ambient mesh background — full-bleed, decorative */
      .s3-bg-mesh {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .s3-bg-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.18;
      }
      .s3-bg-blob-1 {
        width: 700px;
        height: 700px;
        background: var(--brand-primary);
        top: -200px;
        left: -150px;
      }
      .s3-bg-blob-2 {
        width: 600px;
        height: 600px;
        background: var(--brand-secondary);
        bottom: -180px;
        right: 200px;
      }
      .s3-bg-blob-3 {
        width: 400px;
        height: 400px;
        background: var(--brand-accent);
        top: 300px;
        right: -100px;
      }

      /* World wrapper for viewport-change camera pan */
      .s3-world {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
        z-index: 1;
      }

      /* Layout: asymmetric 60/40 flex row */
      .s3-layout {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: row;
        align-items: center;
        padding: 60px 80px;
        gap: 36px;
      }

      /* Left 60% — primary feature card */
      .s3-left-col {
        flex: 0 0 calc(60% - 18px);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        height: 100%;
      }

      .s3-feature-card {
        background: var(--brand-primary);
        border-radius: var(--radius-card-lg);
        padding: 64px 56px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 28px;
        width: 100%;
        max-height: 860px;
      }

      /* Eyebrow chip */
      .s3-eyebrow-chip {
        display: inline-flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.35);
        border-radius: var(--radius-pill);
        padding: 8px 20px;
        font-family: var(--font-mono);
        font-size: 18px;
        letter-spacing: 0.04em;
        color: var(--ink);
        opacity: 0;
      }

      /* Display headline */
      .s3-headline {
        font-family: var(--font-display);
        font-size: 88px;
        font-weight: 500;
        line-height: 1.05;
        color: var(--ink);
        max-width: 820px;
        opacity: 0;
      }
      .s3-headline em {
        font-style: italic;
      }

      /* Dashed rule between headline and formula copy */
      .s3-rule {
        width: 100%;
        height: 1px;
        border: none;
        border-top: var(--rule-dashed);
        opacity: 0;
      }

      /* Formula copy — second beat */
      .s3-formula-copy {
        font-family: var(--font-body);
        font-size: 30px;
        font-weight: 400;
        line-height: 1.55;
        color: var(--ink);
        max-width: 760px;
        opacity: 0;
      }

      /* ASR keyword glow words inside formula */
      .s3-kw {
        display: inline-block;
        transform-origin: 50% 50%;
        will-change: transform, text-shadow;
      }

      /* Right 40% — hibiscus SVG icon panel */
      .s3-right-col {
        flex: 0 0 calc(40% - 18px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
      }

      .s3-icon-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        width: 100%;
        height: 100%;
      }

      .s3-hibiscus-svg {
        width: 380px;
        height: 380px;
        opacity: 0;
      }

      .s3-icon-label {
        font-family: var(--font-mono);
        font-size: 16px;
        letter-spacing: 0.12em;
        color: var(--ink);
        opacity: 0.55;
        text-transform: none;
      }
    </style>

    <!-- Ambient mesh background (decorative, full-bleed) -->
    <div class="s3-bg-mesh">
      <div class="s3-bg-blob s3-bg-blob-1"></div>
      <div class="s3-bg-blob s3-bg-blob-2"></div>
      <div class="s3-bg-blob s3-bg-blob-3"></div>
    </div>

    <!-- World wrapper: viewport-change rightward pan acts on this -->
    <div class="s3-world" id="s3-world">
      <div class="s3-layout">

        <!-- Left 60%: feature card -->
        <div class="s3-left-col">
          <div class="s3-feature-card">
            <!-- Eyebrow chip — beat 1, immediate -->
            <div class="s3-eyebrow-chip" id="s3-eyebrow">Hoolia</div>

            <!-- Display headline — beat 1 (~0.4s) -->
            <div class="s3-headline" id="s3-headline">Nettoyant Visage</div>

            <hr class="s3-rule" id="s3-rule">

            <!-- Formula copy — beat 2 (~1.1s after headline) with ASR keyword spans -->
            <div class="s3-formula-copy" id="s3-formula">
              À base d'extrait d'<span class="s3-kw" data-word="hibiscus">hibiscus</span>,
              <span class="s3-kw" data-word="purifie">purifie</span> et illumine
              <em>en douceur</em>.
            </div>
          </div>
        </div>

        <!-- Right 40%: hibiscus SVG icon panel -->
        <div class="s3-right-col">
          <div class="s3-icon-panel">
            <!-- Hibiscus SVG: 5 petals + center dot, drawn inline for enrichment -->
            <svg class="s3-hibiscus-svg" id="s3-hibiscus" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <!-- Petal 1 — top -->
              <ellipse id="s3-petal-1" cx="100" cy="55" rx="22" ry="48"
                fill="var(--brand-secondary)" stroke="var(--ink)" stroke-width="1.5" opacity="0.9"/>
              <!-- Petal 2 — upper right -->
              <ellipse id="s3-petal-2" cx="148" cy="72" rx="22" ry="48"
                fill="var(--brand-secondary)" stroke="var(--ink)" stroke-width="1.5" opacity="0.9"
                transform="rotate(72 100 100)"/>
              <!-- Petal 3 — lower right -->
              <ellipse id="s3-petal-3" cx="130" cy="140" rx="22" ry="48"
                fill="var(--brand-secondary)" stroke="var(--ink)" stroke-width="1.5" opacity="0.9"
                transform="rotate(144 100 100)"/>
              <!-- Petal 4 — lower left -->
              <ellipse id="s3-petal-4" cx="70" cy="140" rx="22" ry="48"
                fill="var(--brand-secondary)" stroke="var(--ink)" stroke-width="1.5" opacity="0.9"
                transform="rotate(216 100 100)"/>
              <!-- Petal 5 — upper left -->
              <ellipse id="s3-petal-5" cx="52" cy="72" rx="22" ry="48"
                fill="var(--brand-secondary)" stroke="var(--ink)" stroke-width="1.5" opacity="0.9"
                transform="rotate(288 100 100)"/>
              <!-- Stamen outer ring -->
              <circle id="s3-stamen-ring" cx="100" cy="100" r="20"
                fill="var(--brand-accent)" stroke="var(--ink)" stroke-width="1.5"/>
              <!-- Center dot -->
              <circle id="s3-center-dot" cx="100" cy="100" r="10"
                fill="var(--ink)"/>
            </svg>

            <div class="s3-icon-label">hibiscus sabdariffa</div>
          </div>
        </div>

      </div>
    </div><!-- /s3-world -->

    <script>
      const EASE = {
        entry: "power2.out",
        emphasis: "power2.inOut",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 1.0,
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const SCENE_DUR = 10.731;

      // ─── VIEWPORT-CHANGE: gentle rightward pan ───────────────────────────
      // Camera moves right → world translates left (negative x).
      // Single-wrapper form: translate(x,y) scale(S); S stays 1.0 (gentle pan only).
      const world = document.getElementById("s3-world");
      const cam = { scale: 1, x: 0, y: 0 };
      function applyCamera() {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      }
      applyCamera();

      // Pan from 0 → −48px over the full scene (very gentle, "breathing rightward")
      tl.to(cam, {
        x: -48,
        duration: SCENE_DUR,
        ease: EASE.drift,
        onUpdate: applyCamera,
      }, 0);

      // ─── DISCRETE-TEXT-SEQUENCE: beat 1 (0→0.4s) then beat 2 (~1.1s) ───
      // Beat 1: eyebrow chip + headline appear
      // Beat 2: rule + formula copy appear (~0.7s gap after headline per brief)

      // Beat 1 — eyebrow chip
      tl.fromTo("#s3-eyebrow",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry },
        0.2
      );

      // Beat 1 — headline (~0.4s)
      tl.fromTo("#s3-headline",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: DUR.slow, ease: EASE.entry },
        0.4
      );

      // Rule fades in with beat 2
      tl.fromTo("#s3-rule",
        { opacity: 0 },
        { opacity: 1, duration: DUR.med, ease: EASE.entry },
        1.1
      );

      // Beat 2 — formula copy (~0.7s gap after headline lands at 0.4+1.0=1.4, so ~1.1s start)
      tl.fromTo("#s3-formula",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: DUR.slow, ease: EASE.entry },
        1.1
      );

      // ─── SVG-ICON-ENRICHMENT: hibiscus petals open progressively + center pulse ──
      // Hibiscus panel fades in early
      tl.fromTo("#s3-hibiscus",
        { opacity: 0, scale: 0.88 },
        { opacity: 1, scale: 1, duration: DUR.slow, ease: EASE.entry },
        0.15
      );

      // Petals open from scale 0 staggered (simulate "opening" petals)
      // Using setAttribute for SVG transform-safe scaling around center
      const petalIds = ["s3-petal-1", "s3-petal-2", "s3-petal-3", "s3-petal-4", "s3-petal-5"];
      const petalState = { p: 0 };
      const PETAL_DUR = 1.8; // petals fully open over 1.8s
      const PETAL_STAGGER = 0.18;
      const PETAL_START = 0.6;

      petalIds.forEach((pid, i) => {
        const el = document.getElementById(pid);
        const startT = PETAL_START + i * PETAL_STAGGER;
        const localState = { s: 0.0 };
        tl.fromTo(localState,
          { s: 0.0 },
          {
            s: 1.0,
            duration: PETAL_DUR,
            ease: EASE.entry,
            onUpdate: () => {
              const sc = localState.s;
              el.setAttribute("transform",
                (el.getAttribute("transform") || "").replace(/scale\([^)]*\)\s*/g, "") +
                ` translate(100,100) scale(${sc}) translate(-100,-100)`
              );
              el.style.opacity = String(0.2 + sc * 0.7);
            },
          },
          startT
        );
      });

      // Center dot pulse — sin-driven, continuous
      const pulseState = { p: 0 };
      const PULSE_CYCLES = 5; // ~5 pulses over scene duration after start
      tl.to(pulseState, {
        p: Math.PI * 2 * PULSE_CYCLES,
        duration: SCENE_DUR - 1.5,
        ease: "none",
        onUpdate: () => {
          const sc = 1 + Math.sin(pulseState.p) * 0.18;
          const dot = document.getElementById("s3-center-dot");
          const ring = document.getElementById("s3-stamen-ring");
          dot.setAttribute("transform", `translate(100,100) scale(${sc}) translate(-100,-100)`);
          const ringOpacity = 0.6 + Math.sin(pulseState.p) * 0.35;
          ring.style.opacity = String(ringOpacity);
        },
      }, 1.5);

      // ─── ASR-KEYWORD-GLOW: "hibiscus" (~3s) and "purifie" (~4.8s) ──────
      // Timings: formula copy appears at 1.1s, narration is concurrent with scene.
      // "hibiscus" spoken ~3s into scene, "purifie" ~4.8s.
      const TIMINGS = {
        hibiscus: { start: 3.0, end: 3.8 },
        purifie:  { start: 4.8, end: 5.4 },
      };

      const ATTACK_DUR  = 0.18;
      const RELEASE     = 0.35;
      const REST_LEVEL  = 0.15;
      const MAX_BLUR    = 22;
      const MAX_SCALE_BOOST = 0.08;

      function glowRgba(env) {
        // Brand primary glow: #00B4CC
        const alpha = 0.18 + env * 0.65;
        return `rgba(0,180,204,${alpha.toFixed(2)})`;
      }

      function envelope(time, start, end) {
        const releaseEnd = end + RELEASE;
        if (time < start) return 0;
        if (time < end) {
          return Math.min((time - start) / ATTACK_DUR, 1);
        }
        if (time < releaseEnd) {
          const decay = (time - end) / RELEASE;
          return 1 - decay * (1 - REST_LEVEL);
        }
        return REST_LEVEL;
      }

      const kwEls = document.querySelectorAll(".s3-kw");
      const asrDriver = { t: 0 };
      tl.to(asrDriver, {
        t: SCENE_DUR,
        duration: SCENE_DUR,
        ease: "none",
        onUpdate: () => {
          kwEls.forEach((el) => {
            const word = el.dataset.word;
            const timing = TIMINGS[word];
            if (!timing) return;
            const env = envelope(asrDriver.t, timing.start, timing.end);
            const blur = MAX_BLUR * env;
            const scale = 1 + MAX_SCALE_BOOST * env;
            el.style.textShadow = `0 0 ${blur}px ${glowRgba(env)}`;
            el.style.transform = `scale(${scale})`;
          });
        },
      }, 0);

      window.__timelines["scene_3"] = tl;
    </script>
  </div>
</template>
