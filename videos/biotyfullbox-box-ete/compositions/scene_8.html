<template id="scene_8-template">
  <div id="root" class="scene_8-root" data-composition-id="scene_8" data-width="1920" data-height="1080" data-duration="8.021" style="position:relative; width:1920px; height:1080px; overflow:hidden;">
    <style>
      #root {
        background: var(--canvas);
        font-family: var(--font-body);
      }
      #root *,
      #root *::before,
      #root *::after {
        box-sizing: border-box;
      }

      /* Ambient mesh background — full-bleed, decorative, exempt from keepout */
      .s8-bg-mesh {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .s8-bg-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.18;
      }
      .s8-bg-blob-1 {
        width: 900px; height: 900px;
        background: var(--brand-primary);
        top: -200px; left: -150px;
      }
      .s8-bg-blob-2 {
        width: 700px; height: 700px;
        background: var(--brand-secondary);
        bottom: -100px; right: 200px;
      }
      .s8-bg-blob-3 {
        width: 500px; height: 500px;
        background: var(--brand-accent);
        top: 200px; right: -100px;
        opacity: 0.12;
      }

      /* Camera wrapper */
      .s8-camera {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* Stage — centered flex layout */
      .s8-stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
      }

      /* Eyebrow label above the stat */
      .s8-eyebrow {
        font-family: var(--font-mono);
        font-size: 18px;
        letter-spacing: 0.14em;
        color: var(--ink);
        opacity: 0.5;
        text-transform: lowercase;
        margin-bottom: 12px;
      }

      /* Stat counter block */
      .s8-counter-wrap {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 0;
        width: 320px;
        text-align: center;
      }
      .s8-counter-number {
        font-family: var(--font-display);
        font-weight: 700;
        color: var(--brand-primary);
        font-variant-numeric: tabular-nums;
        font-size: 140px;
        letter-spacing: -4px;
        line-height: 1;
        will-change: transform;
        display: block;
      }
      .s8-counter-suffix {
        font-family: var(--font-display);
        font-weight: 700;
        color: var(--ink);
        font-size: 56px;
        opacity: 0;
        display: inline-block;
        transform: translateY(20px);
        margin-left: 4px;
        line-height: 1;
      }

      /* Body label beneath the number */
      .s8-stat-label {
        font-family: var(--font-body);
        font-size: 22px;
        color: var(--ink);
        opacity: 0;
        margin-top: 8px;
        letter-spacing: 0.04em;
        text-align: center;
      }

      /* ASR phrase — "valeur supérieure" highlighted phrase */
      .s8-asr-phrase {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-top: 28px;
        font-family: var(--font-body);
        font-size: 24px;
        color: var(--ink);
        opacity: 0;
      }
      .s8-word {
        display: inline-block;
        transform-origin: 50% 50%;
        will-change: transform, text-shadow;
      }
      .s8-word-accent {
        color: var(--brand-primary);
        font-weight: 600;
      }

      /* Benefit chips — positioned absolutely around the stat */
      .s8-chips-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: visible;
      }
      .s8-chip {
        position: absolute;
        top: 50%;
        left: 50%;
        /* transform handles centering + offset via GSAP xPercent/yPercent/x/y */
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        background: var(--surface-card);
        border: var(--rule-solid);
        border-radius: var(--radius-pill);
        font-family: var(--font-body);
        font-size: 17px;
        font-weight: 500;
        color: var(--ink);
        white-space: nowrap;
        will-change: transform;
        opacity: 0;
        box-shadow: 0 2px 16px rgba(0,0,0,0.06);
      }
      .s8-chip-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--brand-primary);
        flex-shrink: 0;
      }
    </style>

    <!-- Ambient background mesh -->
    <div class="s8-bg-mesh">
      <div class="s8-bg-blob s8-bg-blob-1"></div>
      <div class="s8-bg-blob s8-bg-blob-2"></div>
      <div class="s8-bg-blob s8-bg-blob-3"></div>
    </div>

    <!-- Camera wrapper (slow dolly-in) -->
    <div class="s8-camera" id="s8-camera">

      <!-- Central stage: stat block -->
      <div class="s8-stage">
        <div class="s8-eyebrow">produits découverts</div>

        <div class="s8-counter-wrap">
          <span class="s8-counter-number" id="s8-counter">6</span><span class="s8-counter-suffix">+</span>
        </div>

        <div class="s8-stat-label" id="s8-stat-label">produits naturels et bio</div>

        <!-- ASR phrase: "une valeur supérieure" -->
        <div class="s8-asr-phrase" id="s8-asr-phrase">
          <span class="s8-word" data-word="une">une</span>
          <span class="s8-word s8-word-accent" data-word="valeur">valeur</span>
          <span class="s8-word s8-word-accent" data-word="superieure">supérieure</span>
        </div>
      </div>

      <!-- Benefit chips layer — absolute positioned around stat block center -->
      <div class="s8-chips-layer" id="s8-chips-layer">
        <!-- Chip positions relative to center (960, 540): target offsets in px -->
        <!-- livraison: top-left -->
        <div class="s8-chip" id="s8-chip-1" data-target-x="-340" data-target-y="-200">
          <div class="s8-chip-dot"></div>
          Livraison offerte
        </div>
        <!-- bio: top-right -->
        <div class="s8-chip" id="s8-chip-2" data-target-x="310" data-target-y="-200">
          <div class="s8-chip-dot"></div>
          Certifié bio
        </div>
        <!-- naturel: bottom-left -->
        <div class="s8-chip" id="s8-chip-3" data-target-x="-320" data-target-y="200">
          <div class="s8-chip-dot"></div>
          100% naturel
        </div>
        <!-- valeur: bottom-right -->
        <div class="s8-chip" id="s8-chip-4" data-target-x="280" data-target-y="200">
          <div class="s8-chip-dot"></div>
          Grande valeur
        </div>
      </div>

    </div><!-- /.s8-camera -->

    <script>
      const EASE = {
        entry: "power2.out",
        emphasis: "power2.inOut",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 1.0,
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const TOTAL_DUR = 8.021;

      // ── Phase 0: camera start (slow dolly-in throughout) ──────────────────
      // Start slightly zoomed out, push in gently
      const CAMERA_SCALE_START = 0.94;
      const CAMERA_SCALE_END   = 1.0;
      gsap.set("#s8-camera", { scale: CAMERA_SCALE_START });
      tl.to("#s8-camera", {
        scale: CAMERA_SCALE_END,
        duration: TOTAL_DUR,
        ease: EASE.drift,
      }, 0);

      // ── Phase 1: eyebrow fades in immediately ─────────────────────────────
      tl.fromTo(".s8-eyebrow",
        { opacity: 0, y: 10 },
        { opacity: 0.5, y: 0, duration: DUR.slow, ease: EASE.entry },
        0
      );

      // ── Phase 2: counting-dynamic-scale (6 → 10 with growing font) ────────
      // COUNT_AT: when count starts
      const COUNT_AT   = 0.6;
      const COUNT_DUR  = 1.8;
      const COUNT_EASE = "power3.out";
      const START_SIZE = 140;  // px
      const END_SIZE   = 220;  // px

      const counterEl = document.getElementById("s8-counter");
      const counterState = { value: 6, fontSize: START_SIZE };

      tl.to(counterState, {
        value: 10,
        fontSize: END_SIZE,
        duration: COUNT_DUR,
        ease: COUNT_EASE,
        onUpdate: () => {
          counterEl.textContent = Math.round(counterState.value);
          counterEl.style.fontSize = counterState.fontSize + "px";
        },
      }, COUNT_AT);

      // Suffix "+": slides in after count lands
      tl.to(".s8-counter-suffix", {
        opacity: 1,
        y: 0,
        duration: 0.4,
        ease: "power2.out",
      }, COUNT_AT + COUNT_DUR + 0.05);

      // Stat label fades in early, during count
      tl.to("#s8-stat-label", {
        opacity: 0.65,
        y: 0,
        duration: DUR.slow,
        ease: EASE.entry,
      }, COUNT_AT + 0.3);

      // ── Phase 3: center-outward-expansion (chips burst from stat block) ───
      // Icons start partially spread (START_OFFSET=0.35), expand to targets
      // Chips use same COUNT_AT + COUNT_DUR + COUNT_EASE as counter (chord)
      const START_OFFSET = 0.35;
      const chipIds = ["#s8-chip-1", "#s8-chip-2", "#s8-chip-3", "#s8-chip-4"];

      chipIds.forEach((sel, i) => {
        const el = document.querySelector(sel);
        const targetX = Number(el.dataset.targetX);
        const targetY = Number(el.dataset.targetY);
        // Pre-position: start at (1 - START_OFFSET) fraction toward center from target
        const startX = targetX * START_OFFSET;
        const startY = targetY * START_OFFSET;

        tl.fromTo(sel,
          { xPercent: -50, yPercent: -50, x: startX, y: startY, scale: 0.55, opacity: 0 },
          {
            x: targetX,
            y: targetY,
            scale: 1,
            opacity: 1,
            duration: COUNT_DUR,
            ease: COUNT_EASE,
          },
          COUNT_AT + i * 0.05
        );
      });

      // ── Phase 4: ASR keyword glow — "valeur supérieure" ──────────────────
      // ASR phrase fades in around t=2.8
      const PHRASE_IN = COUNT_AT + COUNT_DUR + 0.4;
      tl.to("#s8-asr-phrase", {
        opacity: 1,
        duration: DUR.slow,
        ease: EASE.entry,
      }, PHRASE_IN);

      // ASR envelope driver — single linear tween over full scene
      const ATTACK_DUR  = 0.15;
      const RELEASE     = 0.35;
      const REST_LEVEL  = 0.2;
      const MAX_BLUR    = 20;
      const MAX_SCALE_BOOST = 0.08;
      const SCENE_DURATION  = TOTAL_DUR;

      // keyword "valeur supérieure" narrated around t=5-6s of the scene
      const TIMINGS = {
        une:        { start: 4.8, end: 5.1 },
        valeur:     { start: 5.1, end: 5.7 },
        superieure: { start: 5.7, end: 6.4 },
      };

      function envelope(time, start, end) {
        const releaseEnd = end + RELEASE;
        if (time < start) return 0;
        if (time < end) {
          return Math.min((time - start) / ATTACK_DUR, 1);
        }
        if (time < releaseEnd) {
          const decay = (time - end) / RELEASE;
          return 1 - decay * (1 - REST_LEVEL);
        }
        return REST_LEVEL;
      }

      const asrWords = document.querySelectorAll(".s8-word");
      const asrDriver = { t: 0 };
      tl.to(asrDriver, {
        t: SCENE_DURATION,
        duration: SCENE_DURATION,
        ease: "none",
        onUpdate: () => {
          asrWords.forEach((el) => {
            const word = el.dataset.word;
            const timing = TIMINGS[word];
            if (!timing) return;
            const env = envelope(asrDriver.t, timing.start, timing.end);
            const blur = MAX_BLUR * env;
            const scaleFactor = 1 + MAX_SCALE_BOOST * env;
            // glow color: brand-primary (#00B4CC) with alpha
            const alpha = 0.3 + env * 0.6;
            el.style.textShadow = "0 0 " + blur + "px rgba(0,180,204," + alpha + ")";
            el.style.transform = "scale(" + scaleFactor + ")";
          });
        },
      }, 0);

      // ── Phase 5: sine-wave-loop — stat block breathes after count lands ──
      // Stat block = counter + suffix + label together; breathe via counter element
      const IDLE_START = COUNT_AT + COUNT_DUR + 0.15;
      const IDLE_DUR   = TOTAL_DUR - IDLE_START;
      const CYCLES     = Math.floor(IDLE_DUR / 2.5);  // ~2-3 breaths
      const SAFE_CYCLES = Math.max(1, CYCLES);

      const sinePhase = { p: 0 };
      tl.to(sinePhase, {
        p: Math.PI * 2 * SAFE_CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: () => {
          const FADE_FRAC = 0.18;
          const t = sinePhase.p / (Math.PI * 2 * SAFE_CYCLES); // 0→1
          const env = t < 1 - FADE_FRAC ? 1 : (1 - t) / FADE_FRAC;
          const scale = 1 + Math.sin(sinePhase.p) * 0.012 * env;
          const y = Math.sin(sinePhase.p) * 3 * env;
          counterEl.style.transform = "translateY(" + y + "px) scale(" + scale + ")";
        },
      }, IDLE_START);

      window.__timelines["scene_8"] = tl;
    </script>
  </div>
</template>
