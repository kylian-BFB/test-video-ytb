<template id="scene_7-template">
  <div id="root" class="scene_7-root" data-composition-id="scene_7" data-width="1920" data-height="1080" data-duration="8.981" style="position:relative; width:1920px; height:1080px; overflow:hidden;">
    <style>
      #root {
        background: var(--canvas);
        font-family: var(--font-body);
      }
      #root *,
      #root *::before,
      #root *::after {
        box-sizing: border-box;
      }

      /* Ambient brand mesh — full-bleed decorative background layer */
      .s7-bg-mesh {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .s7-bg-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.22;
      }
      .s7-bg-blob-1 {
        width: 700px;
        height: 700px;
        background: var(--brand-primary);
        top: -180px;
        right: 200px;
      }
      .s7-bg-blob-2 {
        width: 500px;
        height: 500px;
        background: var(--brand-secondary);
        bottom: -100px;
        left: 60px;
      }
      .s7-bg-blob-3 {
        width: 400px;
        height: 400px;
        background: var(--brand-accent);
        top: 300px;
        right: 500px;
        opacity: 0.13;
      }

      /* Camera wrapper — wraps all content for multi-phase zoom */
      .s7-camera {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
        z-index: 1;
      }

      /* Rule-of-thirds layout: left two-thirds content + right-third ornament */
      .s7-layout {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        padding: 80px;
        gap: 0;
      }

      /* Left content zone (~60%) — editorial soft card anchored upper-left */
      .s7-left {
        flex: 0 0 60%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-right: 48px;
      }

      /* Soft card — primary editorial container */
      .s7-soft-card {
        background: var(--surface-card);
        border-radius: var(--radius-card-lg);
        padding: 56px 56px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        color: var(--ink);
        max-width: 820px;
      }

      /* Hero headline — display serif, "Éclat parfait" */
      .s7-headline {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: 72px;
        line-height: 1.05;
        letter-spacing: -0.01em;
        margin: 0;
        color: var(--ink);
        display: inline-block;
        will-change: transform;
      }
      .s7-headline em {
        font-style: italic;
        font-weight: 400;
        color: var(--brand-primary);
      }

      /* Body lines container — staggered reveal */
      .s7-body-lines {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* Individual body copy lines for ASR glow */
      .s7-body-line {
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 26px;
        line-height: 1.5;
        color: color-mix(in srgb, var(--ink) 75%, transparent);
        margin: 0;
        display: block;
      }

      /* Keyword glow targets — inline display:inline-block required */
      .s7-kw {
        display: inline-block;
        transform-origin: 50% 50%;
        will-change: transform, text-shadow;
      }

      /* Third body line — appears after stillness-before-climax */
      .s7-body-line-3 {
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 24px;
        line-height: 1.5;
        font-style: italic;
        color: color-mix(in srgb, var(--ink) 60%, transparent);
        margin: 0;
        display: block;
        opacity: 0;
      }

      /* Right ornament zone (~40%) — SVG botanical arc */
      .s7-right {
        flex: 0 0 40%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      /* SVG botanical arc — decorative, right-third zone */
      .s7-botanical-svg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 520px;
        height: 520px;
        opacity: 0.85;
      }

      .s7-botanical-svg path,
      .s7-botanical-svg line,
      .s7-botanical-svg circle {
        fill: none;
        stroke: var(--brand-primary);
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>

    <!-- Ambient brand mesh background (full-bleed, decorative exempt) -->
    <div class="s7-bg-mesh">
      <div class="s7-bg-blob s7-bg-blob-1"></div>
      <div class="s7-bg-blob s7-bg-blob-2"></div>
      <div class="s7-bg-blob s7-bg-blob-3"></div>
    </div>

    <!-- Camera wrapper — all visible content inside for multi-phase zoom -->
    <div class="s7-camera" id="s7-camera">
      <div class="s7-layout">

        <!-- Left: Primary editorial soft card (upper-left third) -->
        <div class="s7-left">
          <div class="s7-soft-card">
            <!-- Headline: "Éclat parfait" — italic on "éclat" -->
            <h2 class="s7-headline" id="s7-headline"><em>Éclat</em> parfait</h2>

            <!-- Body lines: hydratation + brillantes (ASR glow targets) -->
            <div class="s7-body-lines">
              <p class="s7-body-line" id="s7-line1">
                Un sérum pour une <span class="s7-kw" id="s7-kw-hydratation" data-word="hydratation">hydratation</span> profonde et lumineuse.
              </p>
              <p class="s7-body-line" id="s7-line2">
                Un gloss pour des lèvres <span class="s7-kw" id="s7-kw-brillantes" data-word="brillantes">brillantes</span> et nourries.
              </p>
              <!-- Third line — appears after stillness-before-climax at ~7.2s -->
              <p class="s7-body-line-3" id="s7-line3">Un duo pour sublimer votre regard, naturellement.</p>
            </div>
          </div>
        </div>

        <!-- Right: Decorative SVG botanical arc ornament -->
        <div class="s7-right">
          <svg class="s7-botanical-svg" id="s7-botanical" viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg">
            <!-- Main botanical arc — sweeping outer curve -->
            <path id="s7-arc-main" d="M 100 420 C 60 300 80 160 180 100 C 260 50 360 80 400 160 C 440 240 420 360 360 420" stroke-width="2.5" />
            <!-- Inner delicate arc -->
            <path id="s7-arc-inner" d="M 140 400 C 110 300 130 180 220 130 C 290 90 370 120 400 200" stroke-width="1.5" opacity="0.6" />
            <!-- Small leaf flourish left -->
            <path id="s7-leaf-left" d="M 180 100 C 150 80 130 60 160 50 C 175 45 185 65 180 100" stroke-width="2" />
            <!-- Small leaf flourish right -->
            <path id="s7-leaf-right" d="M 360 420 C 380 440 400 460 390 480 C 380 490 365 470 360 420" stroke-width="2" />
            <!-- Accent dots along arc (drawn as small circles) -->
            <circle id="s7-dot-1" cx="240" cy="78" r="4" fill="var(--brand-primary)" stroke="none" opacity="0" />
            <circle id="s7-dot-2" cx="390" cy="175" r="3.5" fill="var(--brand-secondary)" stroke="none" opacity="0" />
            <circle id="s7-dot-3" cx="375" cy="350" r="3" fill="var(--brand-accent)" stroke="none" opacity="0" />
          </svg>
        </div>

      </div>
    </div>

    <script>
      const EASE = {
        entry: "power2.out",
        emphasis: "power2.inOut",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 1.0,
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const SCENE_DURATION = 8.981;
      const camera = document.getElementById("s7-camera");

      // ── Multi-Phase Camera ──────────────────────────────────────────────────
      // Phase 1: start slightly pulled back, settle to neutral (~0–1.5s)
      // Phase 2: slow push-in through ~1.5s–4.5s
      // Phase 3: micro-drift hold ~4.5s–end (stillness-before-climax territory)
      const camPhase = { scale: 0.94 };

      // Phase 2 — settle from pullback to neutral + begin slow push
      tl.to(camPhase, {
        scale: 0.98,
        duration: 1.4,
        ease: "power2.out",
      }, 0.1);

      // Phase 3 — slow push-in
      tl.to(camPhase, {
        scale: 1.05,
        duration: 3.5,
        ease: "power2.inOut",
      }, 1.5);

      // Phase 4 — micro-drift hold (slightly settle back)
      tl.to(camPhase, {
        scale: 1.04,
        duration: 2.0,
        ease: "power2.out",
      }, 5.0);

      // Drift driver — continuous sine motion overlaid on phase scale
      const drift = { p: 0 };
      tl.to(drift, {
        p: Math.PI * 2 * 1.5,
        duration: SCENE_DURATION,
        ease: "none",
        onUpdate: () => {
          const dx = Math.sin(drift.p) * 4;
          const dy = Math.sin(drift.p * 1.3) * 2;
          camera.style.transform = `scale(${camPhase.scale}) translate(${dx}px, ${dy}px)`;
        },
      }, 0);

      // ── Content entry reveals ───────────────────────────────────────────────
      // Headline fades in early — primary focus
      tl.fromTo("#s7-headline",
        { opacity: 0, y: 28, scale: 0.97 },
        { opacity: 1, y: 0, scale: 1, duration: DUR.slow, ease: EASE.entry },
        0.3
      );

      // Body line 1 — "hydratation" line, enters at ~1.1s
      tl.fromTo("#s7-line1",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry },
        1.1
      );

      // Body line 2 — "brillantes" line, enters at ~1.6s
      tl.fromTo("#s7-line2",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry },
        1.6
      );

      // ── SVG Path Draw — botanical arc (right-third zone) ──────────────────
      // Measure path lengths and initialize dasharray/dashoffset at setup
      const paths = document.querySelectorAll("#s7-botanical path");
      paths.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = `${len}`;
        p.style.strokeDashoffset = `${len}`;
      });

      // Main arc draws first
      tl.to("#s7-arc-main", {
        strokeDashoffset: 0,
        duration: 0.7,
        ease: "power2.out",
      }, 1.8);

      // Inner arc follows
      tl.to("#s7-arc-inner", {
        strokeDashoffset: 0,
        duration: 0.55,
        ease: "power2.out",
      }, 2.2);

      // Left leaf flourish
      tl.to("#s7-leaf-left", {
        strokeDashoffset: 0,
        duration: 0.4,
        ease: "power2.out",
      }, 2.55);

      // Right leaf flourish
      tl.to("#s7-leaf-right", {
        strokeDashoffset: 0,
        duration: 0.4,
        ease: "power2.out",
      }, 2.75);

      // Accent dots pop in after strokes settle
      tl.to("#s7-dot-1", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 3.1);
      tl.to("#s7-dot-2", { opacity: 0.85, duration: DUR.snap, ease: EASE.entry }, 3.25);
      tl.to("#s7-dot-3", { opacity: 0.7, duration: DUR.snap, ease: EASE.entry }, 3.4);

      // ── ASR Keyword Glow ──────────────────────────────────────────────────
      // "hydratation" glows at ~3s, "brillantes" glows at ~6s
      const TIMINGS = {
        hydratation: { start: 2.8, end: 3.8 },
        brillantes:  { start: 5.8, end: 6.8 },
      };

      const ATTACK_DUR = 0.18;
      const RELEASE = 0.35;
      const REST_LEVEL = 0.15;
      const MAX_BLUR = 28;
      const MAX_SCALE_BOOST = 0.10;

      // Glow color: brand-primary turquoise #00B4CC
      const GLOW_R = 0, GLOW_G = 180, GLOW_B = 204;
      const GLOW_ALPHA_BASE = 0.1;
      const GLOW_ALPHA_RANGE = 0.65;

      function glowColorRgba(env) {
        return `rgba(${GLOW_R}, ${GLOW_G}, ${GLOW_B}, ${GLOW_ALPHA_BASE + env * GLOW_ALPHA_RANGE})`;
      }

      function envelope(time, start, end) {
        const releaseEnd = end + RELEASE;
        if (time < start) return 0;
        if (time < end) {
          const attack = Math.min((time - start) / ATTACK_DUR, 1);
          return attack;
        }
        if (time < releaseEnd) {
          const decay = (time - end) / RELEASE;
          return 1 - decay * (1 - REST_LEVEL);
        }
        return REST_LEVEL;
      }

      // Karaoke style: dim rest, bright active
      const REST_RGB   = { r: 100, g: 120, b: 120 };
      const ACTIVE_RGB = { r: 0,   g: 100, b: 115 };

      function lerpChannel(a, b, t) {
        return Math.round(a + (b - a) * t);
      }
      function colorAt(env) {
        return `rgb(${lerpChannel(REST_RGB.r, ACTIVE_RGB.r, env)}, ${lerpChannel(REST_RGB.g, ACTIVE_RGB.g, env)}, ${lerpChannel(REST_RGB.b, ACTIVE_RGB.b, env)})`;
      }

      const kwEls = document.querySelectorAll(".s7-kw");
      const asrDriver = { t: 0 };
      tl.to(asrDriver, {
        t: SCENE_DURATION,
        duration: SCENE_DURATION,
        ease: "none",
        onUpdate: () => {
          kwEls.forEach((el) => {
            const word = el.dataset.word;
            const timing = TIMINGS[word];
            if (!timing) return;
            const env = envelope(asrDriver.t, timing.start, timing.end);
            const blur = MAX_BLUR * env;
            const scale = 1 + MAX_SCALE_BOOST * env;
            el.style.textShadow = `0 0 ${blur}px ${glowColorRgba(env)}`;
            el.style.transform = `scale(${scale})`;
            el.style.color = colorAt(env);
          });
        },
      }, 0);

      // ── Stillness-before-climax: 0.6s after second keyword glow peaks (~6.6s)
      // Final body phrase (line 3) appears at ~7.2s
      tl.to("#s7-line3", {
        opacity: 1,
        y: 0,
        duration: DUR.med,
        ease: EASE.entry,
      }, 7.2);

      // Set initial state for line3 (y offset)
      gsap.set("#s7-line3", { y: 12 });

      // ── Sine Wave Loop — headline breathes as sole secondary live element ──
      // Entry settles by ~1.3s; idle begins at 1.4s
      const IDLE_START = 1.4;
      const IDLE_DUR = SCENE_DURATION - IDLE_START; // 7.581s
      const IDLE_CYCLES = Math.max(0, Math.floor(IDLE_DUR / 2.8)); // ~2 cycles, ~2.8s each
      const SCALE_AMP = 0.010;
      const Y_AMP_PX = 2.5;

      const idlePhase = { p: 0 };
      tl.to(idlePhase, {
        p: Math.PI * 2 * IDLE_CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: () => {
          const scale = 1 + Math.sin(idlePhase.p) * SCALE_AMP;
          const y = Math.sin(idlePhase.p) * Y_AMP_PX;
          const el = document.getElementById("s7-headline");
          if (el) el.style.transform = `translateY(${y}px) scale(${scale})`;
        },
      }, IDLE_START);

      window.__timelines["scene_7"] = tl;
    </script>
  </div>
</template>
